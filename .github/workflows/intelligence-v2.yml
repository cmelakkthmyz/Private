name: Premier League Intelligence V2 Backtest
on:
  push:
    branches: [premier-league-model-v2]
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check research/intelligenceV2.mjs
          node --check research/matchPriority.mjs
          node --check research/walkForwardV2.mjs
      - name: Invariant and anti-leakage tests
        run: node --test research/modelV2.test.mjs
      - name: Historical out-of-sample backtest
        run: node research/walkForwardV2.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: premier-league-intelligence-v2-results
          path: research/results/v2-backtest.json
          if-no-files-found: error
