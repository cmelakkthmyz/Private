name: Sport Predictor AI 3.8 Value Tickets 5–20 APK
on:
  push:
    branches: [sport-predictor-v38-value-5to20]
    paths:
      - "app/**"
      - "research/**"
      - ".github/workflows/sport-predictor-v38-value.yml"
  workflow_dispatch:
# Only one build may mutate the stable APK release at a time.
concurrency:
  group: sport-predictor-v38-value-release
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate model and historical archives
        run: |
          npm install --no-save esbuild@0.25.12
          ./node_modules/.bin/esbuild research/browserAdapter.mjs --bundle --format=iife --target=es2020 --minify --outfile=app/src/main/assets/intelligence.js
          node research/buildMobileArchive.mjs
      - name: JavaScript syntax and UI unit tests
        run: |
          node --check app/src/main/assets/app.js
          node --test test/model.test.cjs research/mobileSmoke.test.mjs research/autoOddsScanner.test.mjs research/ticketEvaluator.test.mjs research/paperSimulation.test.mjs research/modelTicketBuilder.test.mjs research/modelTicketJournal.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK 35
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      # Persist only the *debug* signing key between CI builds.
      # This allows installing updates without Android rejecting changed signatures.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sport-predictor-v34-debug-signing-v1
      - name: Test and compile APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SportPredictorAI-3.8-ValueTickets5to20-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Name the APK for direct GitHub downloads
        run: cp app/build/outputs/apk/debug/app-debug.apk SportPredictorAI-3.8-ValueTickets5to20.apk
      - name: Publish direct APK download in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sport-predictor-v3.8-value-5to20
          name: Sport Predictor AI 3.8 – Value Tickets 5–20
          body: |
            Sport Predictor AI 3.8 – modelové tikety s 5 až 20 zápasy.
            Minimální a maximální počet zápasů, automatický výběr a možnost nového návrhu.
            Při hledání modelové hodnoty vyžaduje kurz z aktuálního API, modelovou
            očekávanou hodnotu alespoň +3 % u každého vybraného tipu a neplýtvá
            malým vkladem na stovky mikrořádků. Výběr může poctivě vrátit žádný tiket.
            Nejde o prokázanou výnosnost ani o garantované kurzy při podání sázky.
            AKU 5–20, modelové KOMBI a skutečné seskupování příležitostí pro MAXIKOMBI.
            Pravidla skupin vycházejí z herního plánu Chance, ale přijetí tiketu, specifická omezení a minimální vklad se vždy ověřují v aplikaci sázkové kanceláře.
            Není prováděno sázení, pouze ukládání simulací a ověřování výsledků.
            Nutná aktuální kurzová data z podporovaného API pro ekonomické hodnocení.
            Debug-signed; versionCode 38; intended as an upgrade to 3.7 if signed by
            the same cached debug key.
          files: SportPredictorAI-3.8-ValueTickets5to20.apk
          fail_on_unmatched_files: true
          make_latest: false
