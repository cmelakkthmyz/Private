name: Premier League Android APK
on:
  push:
    branches: [premier-league-android]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test predictor
        run: |
          node --check app/src/main/assets/model.js
          node --check app/src/main/assets/app.js
          node --test test/model.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PremierLeaguePredictor-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
