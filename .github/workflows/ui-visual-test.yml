name: Sport Predictor Android Visual UI Test
on:
  push:
    branches: [premier-league-model-v2, 'codex/sport-predictor-fresh-odds']
  pull_request:
    branches: [premier-league-android]
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI test dependencies
        run: |
          npm install --no-save esbuild@0.25.12 playwright@latest
          npx playwright install chromium
      - name: Inspect Chance public odds page with normal unauthenticated browser
        run: node research/probeChancePublic.mjs
        continue-on-error: true
      - name: Build real Android HTML and V3 engine
        run: |
          ./node_modules/.bin/esbuild research/browserAdapter.mjs --bundle --format=iife --target=es2020 --minify --outfile=app/src/main/assets/intelligence.js
          node research/buildMobileArchive.mjs
      - name: Test responsive mobile screen, actual click actions and bookmaker odds feed
        run: node research/uiVisual.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sport-predictor-android-mobile-screenshots
          path: |
            research/screenshots/*.png
            research/results/chance-public-probe.json
          if-no-files-found: warn
