name: Real Sports Source Check
on:
  pull_request:
    branches: [premier-league-android]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public real-time football, hockey and bookmaker odds providers
        run: node research/liveSourceSmoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-live-sources-status
          path: research/results/live-source-check.json
          if-no-files-found: warn
