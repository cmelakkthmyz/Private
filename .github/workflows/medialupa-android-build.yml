name: MediaLupa Android 0.6.1 APK
on:
  push:
    branches: [medialupa-android-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded MediaLupa source
        run: |
          mkdir android
          python3 -m zipfile -e android-src.zip android
          test -f android/app/build.gradle.kts
      - name: Bundle verified offline MobileFaceNet model
        run: |
          mkdir -p android/app/src/main/assets
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/Andrew-Hardianto/capacitor-face-recognition-tflite/main/android/src/main/assets/mobile_face_net.tflite \
            --output android/app/src/main/assets/mobile_face_net.tflite
          echo 'be4bc7cfc53f7bc336d0f28b1ab92535f618c913a422b683210750f6b5354854  android/app/src/main/assets/mobile_face_net.tflite' | sha256sum -c -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install Android SDK 36
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble installable Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaLupa-Android-0.6.1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Run regression tests
        if: success()
        continue-on-error: true
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest
