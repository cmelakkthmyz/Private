plugins { id 'com.android.application' }
android {
    namespace 'cz.cmelak.premierpredictor'
    compileSdk 35
    defaultConfig {
        // Each CI debug build has a new signing key. A distinct application ID
        // lets this test build install beside an earlier debug version.
        applicationId 'cz.cmelak.sportpredictor.chance321'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '3.2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
