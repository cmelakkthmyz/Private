[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medialupa-windows"
version = "1.1.1"
description = "Offline-first desktop media organizer with visual search for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary - personal project" }
authors = [{ name = "MediaLupa" }]
dependencies = [
  "PySide6>=6.7,<7",
  "Pillow>=10.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "platformdirs>=4.2",
  "send2trash>=1.8",
]

[project.optional-dependencies]
ai = [
  "sentence-transformers>=3.0,<6",
  "torch>=2.3",
  "transformers>=4.44,<6",
  "safetensors>=0.4",
]
ocr = ["pytesseract>=0.3.13"]
build = ["pyinstaller>=6.10"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
medialupa = "medialupa.app:main"

[tool.setuptools.packages.find]
include = ["medialupa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
